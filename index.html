<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The King Is Dead: Long Island — A regional board game reskin gallery">
    <title>The King Is Dead: Long Island</title>
    
    <!-- Fonts and Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/default-skin/default-skin.min.css">
    
    <style>
        body {
            background: linear-gradient(to bottom, lightblue, aliceblue);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: 4rem;
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .section-title {
            text-align: center;
            font-family: 'Lobster', cursive;
            font-size: 2rem;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #555;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            height: 250px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease-in-out;
            background: rgba(255,255,255,0.2);
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Boards are very tall, let's give them more height */
        #board-gallery img {
            height: 400px;
        }

        /* Logo and other assets can be smaller */
        #assets-gallery img {
            height: 150px;
        }

        .pswp__img {
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1>The King Is Dead: Long Island</h1>
    
    <main>
        <div class="section-title">The Board</div>
        <div class="gallery" id="board-gallery"></div>
        
        <div class="section-title">Region Cards</div>
        <div class="gallery" id="cards-gallery"></div>
        
        <div class="section-title">Assets</div>
        <div class="gallery" id="assets-gallery"></div>

        <noscript>
            <p style="text-align:center">This gallery requires JavaScript. Open the <code>exports/</code> folder to view images if JavaScript is disabled.</p>
        </noscript>
    </main>

    <!-- PhotoSwipe Core Structure -->
    <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="pswp__bg"></div>
        <div class="pswp__scroll-wrap">
            <div class="pswp__container">
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
                <div class="pswp__item"></div>
            </div>
            <div class="pswp__ui pswp__ui--hidden">
                <div class="pswp__top-bar">
                    <div class="pswp__counter"></div>
                    <button class="pswp__button pswp__button--close" title="Close (Esc)"></button>
                    <button class="pswp__button pswp__button--fs" title="Toggle fullscreen"></button>
                    <button class="pswp__button pswp__button--zoom" title="Zoom in/out"></button>
                    <div class="pswp__preloader">
                        <div class="pswp__preloader__icn">
                            <div class="pswp__preloader__cut">
                                <div class="pswp__preloader__donut"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="pswp__button pswp__button--arrow--left" title="Previous (arrow left)"></button>
                <button class="pswp__button pswp__button--arrow--right" title="Next (arrow right)"></button>
                <div class="pswp__caption">
                    <div class="pswp__caption__center"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PhotoSwipe Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe-ui-default.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
