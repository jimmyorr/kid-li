        background: rgba(255, 255, 255, 0.2);
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      /* Boards are very tall, let's give them more height */
      #board-gallery img {
        height: 400px;
      }

      /* Logo and other assets can be smaller */

        height: 150px;
